name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# One deploy at a time. A newer push supersedes any older run still queued or
# running, so a job stuck waiting on a runner can never land on top of newer code.
concurrency:
  group: deploy-main
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271378210266:role/github-actions-deploy
          aws-region: us-east-1
      # pypdf (pure Python) is bundled for the Engagement Docs CEF reader. The code
      # imports it lazily, so a package without it still runs (CEF parsing just skips).
      - run: |
          pip install --no-deps --target build pypdf==6.19.0
          cp lambda_function.py build/
          (cd build && zip -qr ../function.zip .)
          aws lambda update-function-code --function-name Portfolio --zip-file fileb://function.zip
