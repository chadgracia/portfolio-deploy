name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# One deploy at a time. A newer push supersedes any older run still queued or
# running, so a job stuck waiting on a runner can never land on top of newer code.
concurrency:
  group: deploy-main
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271378210266:role/github-actions-deploy
          aws-region: us-east-1
      - run: |
          zip -j function.zip lambda_function.py
          aws lambda update-function-code --function-name Portfolio --zip-file fileb://function.zip
